<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 900 250" width="900" height="250">
  <style>
    .label { font: 700 11px 'Segoe UI', Arial, sans-serif; letter-spacing: 3px; fill: #9198A1; text-anchor: middle; }
    .big { font: 900 40px 'Segoe UI', Arial, sans-serif; fill: #FFFFFF; text-anchor: middle; }
    .of { font-size: 18px; fill: #E10600; }
    .time { font: 700 15px 'Consolas', 'Courier New', monospace; fill: #E6EDF3; text-anchor: middle; }
  </style>
  <defs>
    <path id="track" d="M 210 205 L 600 205 C 705 205 765 175 765 120 C 765 70 725 40 665 40 L 565 40 C 520 40 500 62 482 92 C 462 124 430 132 400 112 L 332 64 C 300 42 262 40 230 52 L 150 82 C 102 100 88 128 88 150 C 88 188 118 205 160 205 Z" />
    <pattern id="check" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#F2F2F2" />
      <rect width="4" height="4" fill="#111" />
      <rect x="4" y="4" width="4" height="4" fill="#111" />
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" />
    </filter>
  </defs>

  <rect x="10" y="10" width="750" height="230" rx="18" fill="#10151C" stroke="#30363D" />
  <g transform="translate(14 6) scale(0.94)">
  <use href="#track" xlink:href="#track" fill="none" stroke="#0A0D12" stroke-width="40" stroke-linejoin="round" opacity="0.6" filter="url(#glow)" />
  <use href="#track" xlink:href="#track" fill="none" stroke="#E10600" stroke-width="30" stroke-linejoin="round" />
  <use href="#track" xlink:href="#track" fill="none" stroke="#F2F2F2" stroke-width="30" stroke-linejoin="round" stroke-dasharray="7 7" />
  <use href="#track" xlink:href="#track" fill="none" stroke="#2A2D33" stroke-width="24" stroke-linejoin="round" />
  <use href="#track" xlink:href="#track" fill="none" stroke="#4A4F57" stroke-width="1.5" stroke-dasharray="10 12" />
  <rect x="206" y="193" width="8" height="24" fill="url(#check)" />
  <text x="226" y="232" class="label" text-anchor="start" style="text-anchor:start;font-size:9px;letter-spacing:2px">START / FINISH</text>

  <g>
    <animateMotion dur="4s" repeatCount="indefinite" rotate="auto">
      <mpath href="#track" xlink:href="#track" />
    </animateMotion>
    <g transform="scale(1.35)">
    <ellipse cx="0" cy="0" rx="16" ry="8" fill="#E10600" opacity="0.35" filter="url(#glow)" />
    <rect x="-11" y="-8" width="6" height="4" rx="1" fill="#1E1E1E" stroke="#5A5A5A" stroke-width="0.6" />
    <rect x="-11" y="4" width="6" height="4" rx="1" fill="#1E1E1E" stroke="#5A5A5A" stroke-width="0.6" />
    <rect x="5" y="-7" width="5" height="3.4" rx="1" fill="#1E1E1E" stroke="#5A5A5A" stroke-width="0.6" />
    <rect x="5" y="3.6" width="5" height="3.4" rx="1" fill="#1E1E1E" stroke="#5A5A5A" stroke-width="0.6" />
    <rect x="-14" y="-5" width="3" height="10" rx="1" fill="#3A3A3A" />
    <path d="M-11 -3 Q-4 -4.5 2 -2 L13 -0.8 L13 0.8 L2 2 Q-4 4.5 -11 3 Z" fill="#FF2B1F" />
    <circle cx="0" cy="0" r="1.8" fill="#FFFFFF" />
    <rect x="12" y="-6" width="2" height="12" rx="0.8" fill="#3A3A3A" />
    </g>
  </g>
  </g>

  <rect x="770" y="10" width="120" height="230" rx="14" fill="#0D1117" stroke="#E10600" stroke-width="1.5" />
  <text x="830" y="44" class="label">LAP</text>
    <g opacity="0"><animate attributeName="opacity" dur="44s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.0909" values="1;0" />
      <text x="830" y="104" class="big">01<tspan class="of">/10</tspan></text>
      <text x="830" y="158" class="time">--:--.---</text>
    </g>
    <g opacity="0"><animate attributeName="opacity" dur="44s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.0909;0.1818" values="0;1;0" />
      <text x="830" y="104" class="big">02<tspan class="of">/10</tspan></text>
      <text x="830" y="158" class="time">1:24.912</text>
    </g>
    <g opacity="0"><animate attributeName="opacity" dur="44s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.1818;0.2727" values="0;1;0" />
      <text x="830" y="104" class="big">03<tspan class="of">/10</tspan></text>
      <text x="830" y="158" class="time">1:23.507</text>
    </g>
    <g opacity="0"><animate attributeName="opacity" dur="44s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.2727;0.3636" values="0;1;0" />
      <text x="830" y="104" class="big">04<tspan class="of">/10</tspan></text>
      <text x="830" y="158" class="time">1:23.118</text>
    </g>
    <g opacity="0"><animate attributeName="opacity" dur="44s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.3636;0.4545" values="0;1;0" />
      <text x="830" y="104" class="big">05<tspan class="of">/10</tspan></text>
      <text x="830" y="158" class="time">1:22.964</text>
    </g>
    <g opacity="0"><animate attributeName="opacity" dur="44s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.4545;0.5455" values="0;1;0" />
      <text x="830" y="104" class="big">06<tspan class="of">/10</tspan></text>
      <text x="830" y="158" class="time">1:23.240</text>
    </g>
    <g opacity="0"><animate attributeName="opacity" dur="44s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.5455;0.6364" values="0;1;0" />
      <text x="830" y="104" class="big">07<tspan class="of">/10</tspan></text>
      <text x="830" y="158" class="time">1:22.701</text>
    </g>
    <g opacity="0"><animate attributeName="opacity" dur="44s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.6364;0.7273" values="0;1;0" />
      <text x="830" y="104" class="big">08<tspan class="of">/10</tspan></text>
      <text x="830" y="158" class="time">1:22.835</text>
    </g>
    <g opacity="0"><animate attributeName="opacity" dur="44s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.7273;0.8182" values="0;1;0" />
      <text x="830" y="104" class="big">09<tspan class="of">/10</tspan></text>
      <text x="830" y="158" class="time">1:22.498</text>
    </g>
    <g opacity="0"><animate attributeName="opacity" dur="44s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.8182;0.9091" values="0;1;0" />
      <text x="830" y="104" class="big">10<tspan class="of">/10</tspan></text>
      <text x="830" y="158" class="time">1:22.612</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" dur="44s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.9091" values="0;1" />
      <rect x="806" y="66" width="48" height="40" rx="3" fill="url(#check)" stroke="#F2F2F2" stroke-width="1" />
      <text x="830" y="136" class="label" style="font-size:9px">BEST LAP</text>
      <text x="830" y="158" class="time">1:22.317</text>
    </g>
  <g>
    <animate attributeName="opacity" dur="44s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.9091" values="1;0" />
    <text x="830" y="136" class="label" style="font-size:9px">LAST LAP</text>
    <rect x="790" y="190" width="80" height="6" rx="3" fill="#30363D" />
    <rect x="790" y="190" width="0" height="6" rx="3" fill="#E10600">
      <animate attributeName="width" from="0" to="80" dur="4s" repeatCount="indefinite" />
    </rect>
    <text x="830" y="218" class="label" style="font-size:9px">LAP PROGRESS</text>
  </g>
</svg>
