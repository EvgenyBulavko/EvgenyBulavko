<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 150" width="900" height="150">
<style>
.car{animation:drive 4.5s cubic-bezier(.45,0,.55,1) infinite}
.sway{transform-origin:130px 75px;animation:sway 1.5s ease-in-out infinite alternate}
.tread{animation:tread .1s linear infinite}
.speed line{animation:speed .5s linear infinite}
.speed line:nth-child(2){animation-delay:.12s}
.speed line:nth-child(3){animation-delay:.25s}
.speed line:nth-child(4){animation-delay:.37s}
.speed line:nth-child(5){animation-delay:.06s}
.speed line:nth-child(6){animation-delay:.31s}
.flame{transform-box:fill-box;transform-origin:right center;animation:flame .07s ease-in-out infinite alternate}
.rain{animation:rain .5s steps(1) infinite}
@keyframes drive{0%{transform:translateX(-300px)}100%{transform:translateX(1030px)}}
@keyframes sway{from{transform:translateY(-4px) rotate(-.6deg)}to{transform:translateY(4px) rotate(.6deg)}}
@keyframes tread{to{stroke-dashoffset:-7}}
@keyframes speed{0%{opacity:0;transform:translateX(20px)}40%{opacity:.9}100%{opacity:0;transform:translateX(-60px)}}
@keyframes flame{from{transform:scaleX(.55);opacity:.65}to{transform:scaleX(1.15);opacity:1}}
@keyframes rain{0%{opacity:1}50%{opacity:.15}}
</style>
<defs>
